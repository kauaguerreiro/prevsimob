# PrevsImob — ambiente padronizado (v1.0.0)
# Subir o site:            docker compose up --build        → http://localhost:${PORT:-8080}
# Rodar o harness:         docker compose run --rm test
# Rodar com cobertura:     docker compose run --rm coverage → relatório em ./coverage/

services:
  web:
    build: .
    image: prevsimob-web:1.0.0
    container_name: prevsimob-web
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped

  test:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm test"
    profiles: ["test"]

  coverage:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm run test:coverage"
    profiles: ["test"]

volumes:
  node_modules:
